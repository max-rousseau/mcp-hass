[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-hass"
version = "1.0.0"
description = "Model Context Protocol integration for Home Assistant"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Maxime Rousseau"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiohttp~=3.13.0",
    "pydantic~=2.12.0",
    "mcp~=1.25.0",
    "click~=8.3.0",
    "pillow~=12.0.0",
    "tiktoken~=0.12.0",
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/max-rousseau/mcp-hass"
Repository = "https://github.com/max-rousseau/mcp-hass"
Issues = "https://github.com/max-rousseau/mcp-hass/issues"
Changelog = "https://github.com/max-rousseau/mcp-hass/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest~=8.3.0",
    "pytest-asyncio~=0.24.0",
    "pytest-cov~=7.1.0",
    "pytest-xdist~=3.5.0",
    "pytest-mock~=3.14.0",
    "pytest-timeout~=2.4.0",
    "black~=25.12.0",
    "flake8~=7.1.0",
    "flake8-pyproject~=1.2.0",
    "bandit~=1.8.0",
    "vulture~=2.14",
    "pip~=25.0",
    "setuptools~=75.0.0",
]

[project.scripts]
mcp-hass = "mcp_hass.main:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
timeout = 30
timeout_method = "thread"
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--cov=src/mcp_hass",
    "--cov-report=html:htmlcov",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "critical: Critical functionality tests",
]

[tool.coverage.run]
source = ["src/mcp_hass"]
branch = true
omit = [
    "src/mcp_hass/__main__.py",
    "src/mcp_hass/main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "E501", "W503"]
exclude = [".venv", "build", "dist", ".git", "__pycache__", "Auto Run Docs", "tmp"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.vulture]
min_confidence = 80
exclude = ["tests/", ".venv/"]

name: Continuous Integration

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

    - name: Set up Python 3.12
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.12"

    - name: Cache pip dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade "setuptools>=78.1.1"
        pip install -e ".[dev]"

    - name: Run pytest
      run: |
        pytest tests/ -v --cov=src/mcp_hass --cov-report=xml --cov-report=term-missing
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4.6.0
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

    - name: Set up Python 3.12
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.12"

    - name: Cache pip dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-quality-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-quality-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade "setuptools>=78.1.1"
        pip install -e .
        pip install flake8 bandit pip-audit black

    - name: Run flake8 linting
      run: |
        echo "🔍 Running flake8 code quality checks..."
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: Run bandit security checks
      run: |
        echo "🔒 Running bandit security analysis..."
        bandit -r src/ -f json -o bandit-report.json || true
        bandit -r src/ -ll

    - name: Run pip-audit dependency security scan
      run: |
        echo "🛡️ Running pip-audit dependency security scan..."
        pip-audit --desc --format=json -o pip-audit-report.json || true
        pip-audit --desc || true

    - name: Run black code formatting check
      run: |
        echo "⚫ Checking code formatting with black..."
        black --check --diff src/ tests/

    - name: Upload security reports as artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          pip-audit-report.json

  integration-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

    - name: Set up Python 3.12
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade "setuptools>=78.1.1"
        pip install -e .

    - name: Test CLI commands
      run: |
        echo "🖥️ Testing CLI functionality..."
        python -m mcp_hass.main --help
        python -m mcp_hass.main tools --help
        python -m mcp_hass.main config --help

    - name: Test configuration validation
      run: |
        echo "⚙️ Testing configuration validation..."
        # Test with missing required variables (should fail gracefully)
        python -m mcp_hass.main validate --no-validate || echo "Expected failure - no HA configuration"

  build-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

    - name: Set up Python 3.12
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.12"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade "setuptools>=78.1.1"
        pip install build twine

    - name: Build package
      run: |
        echo "📦 Building package..."
        python -m build

    - name: Check package
      run: |
        echo "✅ Checking package integrity..."
        twine check dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: dist-packages
        path: dist/